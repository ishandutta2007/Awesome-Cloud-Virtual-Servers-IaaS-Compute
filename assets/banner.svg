<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-gradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#1e1b4b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <linearGradient id="text-gradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>
    <linearGradient id="card-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.07" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.02" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="15" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="400" fill="url(#bg-gradient)" rx="16" />

  <!-- Dynamic Glowing Background Elements (Pulse / Orbit) -->
  <g opacity="0.4">
    <circle cx="200" cy="100" r="180" fill="#38bdf8" opacity="0.15" filter="url(#glow)">
      <animate attributeName="r" values="160;200;160" dur="8s" repeatCount="indefinite" />
    </circle>
    <circle cx="1000" cy="300" r="220" fill="#c084fc" opacity="0.15" filter="url(#glow)">
      <animate attributeName="r" values="200;240;200" dur="10s" repeatCount="indefinite" />
    </circle>
    <circle cx="600" cy="200" r="120" fill="#818cf8" opacity="0.1" filter="url(#glow)">
      <animate attributeName="opacity" values="0.05;0.18;0.05" dur="6s" repeatCount="indefinite" />
    </circle>
  </g>

  <!-- Decorative Network Nodes and Grid (Background layer behind text) -->
  <g opacity="0.2" stroke="#6366f1" stroke-width="1" stroke-dasharray="4 4">
    <line x1="100" y1="320" x2="300" y2="320" />
    <line x1="300" y1="320" x2="450" y2="350" />
    <line x1="750" y1="350" x2="900" y2="320" />
    <line x1="900" y1="320" x2="1100" y2="320" />
    <line x1="200" y1="60" x2="1000" y2="60" />
  </g>

  <!-- Server Tech Cards in Lower Background -->
  <g opacity="0.3">
    <rect x="150" y="290" width="180" height="50" rx="8" fill="url(#card-grad)" stroke="#38bdf8" stroke-width="1" />
    <rect x="510" y="310" width="180" height="50" rx="8" fill="url(#card-grad)" stroke="#818cf8" stroke-width="1" />
    <rect x="870" y="290" width="180" height="50" rx="8" fill="url(#card-grad)" stroke="#c084fc" stroke-width="1" />
  </g>

  <!-- Main Title & Subtitle (Foreground Layer) -->
  <g text-anchor="middle">
    <!-- Category Pill Badge -->
    <rect x="440" y="45" width="320" height="32" rx="16" fill="#1e293b" stroke="#38bdf8" stroke-width="1.5" />
    <text x="600" y="66" fill="#38bdf8" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="700" letter-spacing="2">
      ⚡ IAAS COMPUTE &amp; VIRTUALIZATION
    </text>

    <!-- Main Title -->
    <text x="600" y="145" fill="url(#text-gradient)" font-family="system-ui, -apple-system, sans-serif" font-size="44" font-weight="800" letter-spacing="-0.5">
      Awesome Cloud Virtual Servers
    </text>
    
    <text x="600" y="195" fill="#ffffff" font-family="system-ui, -apple-system, sans-serif" font-size="28" font-weight="600" opacity="0.95">
      Commercial IaaS Platforms &amp; Open-Source Virtualization Stacks
    </text>

    <!-- Subtitle / Key Focus -->
    <text x="600" y="245" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="400">
      AWS • Azure • GCP • OpenStack • Proxmox • CloudStack • DigitalOcean • Hetzner
    </text>
  </g>
</svg>
